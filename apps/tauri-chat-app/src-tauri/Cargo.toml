[package]
name = "encatch-tauri-chat-app"
version = "0.1.0"
description = "Tauri shell for the Encatch mock chat app"
edition = "2021"

[lib]
name = "encatch_tauri_chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
